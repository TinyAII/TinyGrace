# ============================================================
#  TinyGrace 配置文件  v1.0.0
#  支持 1.14 ~ 26.x（同一个 jar）
#  改完执行 /tg reload 生效（全局开关的改动会立即生效）
# ============================================================

# 全局开关。关掉后所有死亡都正常掉落（/tg global on|off 也可切换）
enabled: true

protection:
  # 每个玩家默认享有的保护次数
  base: 10

  # 新玩家额外的保护次数（管理员也可以用 /tg set 给某个人单独加）
  default-bonus: 0

  # 剩余多少次时提醒玩家。写多个，剩余值命中就提醒。
  # 例如 [3, 1] = 剩 3 次、剩 1 次时各提醒一次
  warn-at: [3, 1]

  # 所在世界已经开了 keepInventory 时，是否仍然消耗玩家的保护次数
  # false（默认）= 不消耗，因为本来就不会掉东西，扣次数会让人觉得亏
  keep-inventory-consumes: false

  # 保护生效时是否保留等级与经验
  keep-level: true

  # 配额用完之后，每次死亡是否红色提醒「你没保护了」
  # 关掉的话玩家只会发现东西没了，却不知道为什么
  warn-exhausted: true

# ── 消息 ──────────────────────────────────────────────────
# 用 & 作为颜色码前缀（&a &c &e ...）
# 占位符：{0} {1} {2} 依次替换，具体含义见各条注释
messages:
  # 临界提醒
  # {0} 剩余总次数   {1} 基础配额剩余   {2} 额外次数
  warn: "&e⚠ 你只剩 &f{0} &e次死亡保护了 &7(基础剩余 {1} / 额外 {2})"

  # 配额已用完时的红色提醒（每次无保护死亡都会发）
  # {0} = 累计死亡次数
  exhausted: "&c✖ 你的死亡保护次数已用完，本次死亡掉落了物品 &7(用 /tg info 查看)"

  # 玩家自己关闭保护时的提示
  switch-off: "&7已关闭你的死亡保护（死亡将正常掉落）"

  # 玩家自己开启保护时的提示，{0} = 当前剩余次数
  switch-on: "&a✔ 已开启你的死亡保护（当前剩余 &f{0} &a次）"
